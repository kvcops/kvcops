<svg xmlns="http://www.w3.org/2000/svg" width="590" height="310" viewBox="0 0 590 310" fill="none" role="img"><style>
.serif{font-family:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif} .sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){ *{animation:none!important} }

.comet{stroke-dasharray:120 1649;animation:comet 6s linear infinite}@keyframes comet{to{stroke-dashoffset:-1769}}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left;animation:bar 1.5s .6s cubic-bezier(.6,0,.2,1) both}@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 1.2s cubic-bezier(.6,0,.2,1) both}@keyframes gr{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.blink{animation:bl 1.4s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
.go{animation:go 1.6s ease-in-out infinite}@keyframes go{50%{transform:translateX(5px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
</style><defs><radialGradient id="pglow" cx="100%" cy="0%" r="65%"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0.16"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="588" height="308" rx="18" fill="#07090D" stroke="#232A3A"/><rect x="1" y="1" width="588" height="308" rx="18" fill="url(#pglow)"/><rect class="comet" x="1" y="1" width="588" height="308" rx="18" stroke="#5EEAD4" stroke-width="1.6" stroke-linecap="round"/><g class="up"><text class="mono" x="28" y="42" font-size="11.5" fill="#5EEAD4" letter-spacing="2.2">FILE 02 · MULTI-AGENT SYSTEM</text><text class="serif" x="26" y="88" font-size="36" font-weight="600" fill="#ECE8E1" letter-spacing="-.5">JobHunterX</text><text class="sans" x="28" y="120" font-size="14.5" fill="#ECE8E1" fill-opacity=".85">Six tool-calling agents in one</text><text class="sans" x="28" y="141" font-size="14.5" fill="#ECE8E1" fill-opacity=".85">LangGraph state machine: resume in,</text><text class="sans" x="28" y="162" font-size="14.5" fill="#ECE8E1" fill-opacity=".85">tailored applications out.</text><text x="28" y="212"><tspan class="serif" font-size="30" font-weight="600" fill="#5EEAD4">85</tspan><tspan class="sans" dx="10" font-size="13" fill="#9AA0B0">automated tests · 3 LLM houses</tspan></text><rect x="28" y="232" width="86" height="26" rx="13" fill="#131722" stroke="#232A3A"/><text class="mono" x="71" y="249" text-anchor="middle" font-size="12" fill="#9AA0B0">LangGraph</text><rect x="122" y="232" width="101" height="26" rx="13" fill="#131722" stroke="#232A3A"/><text class="mono" x="172" y="249" text-anchor="middle" font-size="12" fill="#9AA0B0">Browser Use</text><rect x="230" y="232" width="93" height="26" rx="13" fill="#131722" stroke="#232A3A"/><text class="mono" x="277" y="249" text-anchor="middle" font-size="12" fill="#9AA0B0">Playwright</text><rect x="332" y="232" width="71" height="26" rx="13" fill="#131722" stroke="#232A3A"/><text class="mono" x="367" y="249" text-anchor="middle" font-size="12" fill="#9AA0B0">FastAPI</text><text class="mono" x="28" y="290" font-size="12" fill="#5D6475">github.com/kvcops/JobHunterX</text><g class="go"><text class="mono" x="562" y="290" text-anchor="end" font-size="13" fill="#5EEAD4">open →</text></g></g><g class="up" style="animation-delay:.3s"><path d="M400,90 L476,76" stroke="#232A3A" stroke-width="1.4"/><circle r="2.6" fill="#5EEAD4"><animateMotion dur="1.8s" begin="0.00s" repeatCount="indefinite" path="M400,90 L476,76"/></circle><path d="M476,76 L552,90" stroke="#232A3A" stroke-width="1.4"/><circle r="2.6" fill="#5EEAD4"><animateMotion dur="1.8s" begin="0.25s" repeatCount="indefinite" path="M476,76 L552,90"/></circle><path d="M400,90 L430,160" stroke="#232A3A" stroke-width="1.4"/><circle r="2.6" fill="#5EEAD4"><animateMotion dur="1.8s" begin="0.50s" repeatCount="indefinite" path="M400,90 L430,160"/></circle><path d="M476,76 L510,160" stroke="#232A3A" stroke-width="1.4"/><circle r="2.6" fill="#5EEAD4"><animateMotion dur="1.8s" begin="0.75s" repeatCount="indefinite" path="M476,76 L510,160"/></circle><path d="M552,90 L510,160" stroke="#232A3A" stroke-width="1.4"/><circle r="2.6" fill="#5EEAD4"><animateMotion dur="1.8s" begin="1.00s" repeatCount="indefinite" path="M552,90 L510,160"/></circle><path d="M430,160 L510,160" stroke="#232A3A" stroke-width="1.4"/><circle r="2.6" fill="#5EEAD4"><animateMotion dur="1.8s" begin="1.25s" repeatCount="indefinite" path="M430,160 L510,160"/></circle><path d="M430,160 L476,210" stroke="#232A3A" stroke-width="1.4"/><circle r="2.6" fill="#5EEAD4"><animateMotion dur="1.8s" begin="1.50s" repeatCount="indefinite" path="M430,160 L476,210"/></circle><path d="M510,160 L476,210" stroke="#232A3A" stroke-width="1.4"/><circle r="2.6" fill="#5EEAD4"><animateMotion dur="1.8s" begin="1.75s" repeatCount="indefinite" path="M510,160 L476,210"/></circle><circle class="pulse" cx="400" cy="90" r="9" fill="#5EEAD4" fill-opacity=".18" style="animation-delay:0.0s"/><circle cx="400