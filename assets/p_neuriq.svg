<svg xmlns="http://www.w3.org/2000/svg" width="590" height="310" viewBox="0 0 590 310" fill="none" role="img"><style>
.serif{font-family:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif} .sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){ *{animation:none!important} }

.comet{stroke-dasharray:120 1649;animation:comet 6s linear infinite}@keyframes comet{to{stroke-dashoffset:-1769}}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left;animation:bar 1.5s .6s cubic-bezier(.6,0,.2,1) both}@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 1.2s cubic-bezier(.6,0,.2,1) both}@keyframes gr{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.blink{animation:bl 1.4s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
.go{animation:go 1.6s ease-in-out infinite}@keyframes go{50%{transform:translateX(5px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
</style><defs><radialGradient id="pglow" cx="100%" cy="0%" r="65%"><stop offset="0" stop-color="#FF7A45" stop-opacity="0.16"/><stop offset="1" stop-color="#FF7A45" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="588" height="308" rx="18" fill="#07090D" stroke="#232A3A"/><rect x="1" y="1" width="588" height="308" rx="18" fill="url(#pglow)"/><rect class="comet" x="1" y="1" width="588" height="308" rx="18" stroke="#FF7A45" stroke-width="1.6" stroke-linecap="round"/><g class="up"><text class="mono" x="28" y="42" font-size="11.5" fill="#FF7A45" letter-spacing="2.2">FILE 05 · ADAPTIVE LEARNING · LIVE</text><text class="serif" x="26" y="88" font-size="36" font-weight="600" fill="#ECE8E1" letter-spacing="-.5">NeurIQ AI</text><text class="sans" x="28" y="120" font-size="14.5" fill="#ECE8E1" fill-opacity=".85">AI tutor with dynamic roadmaps,</text><text class="sans" x="28" y="141" font-size="14.5" fill="#ECE8E1" fill-opacity=".85">an adaptive learning engine and</text><text class="sans" x="28" y="162" font-size="14.5" fill="#ECE8E1" fill-opacity=".85">spaced-repetition flashcards.</text><text x="28" y="212"><tspan class="serif" font-size="30" font-weight="600" fill="#FF7A45">Live</tspan><tspan class="sans" dx="10" font-size="13" fill="#9AA0B0">deployed on Render</tspan></text><rect x="28" y="232" width="71" height="26" rx="13" fill="#131722" stroke="#232A3A"/><text class="mono" x="64" y="249" text-anchor="middle" font-size="12" fill="#9AA0B0">FastAPI</text><rect x="107" y="232" width="93" height="26" rx="13" fill="#131722" stroke="#232A3A"/><text class="mono" x="154" y="249" text-anchor="middle" font-size="12" fill="#9AA0B0">Gemini API</text><rect x="208" y="232" width="93" height="26" rx="13" fill="#131722" stroke="#232A3A"/><text class="mono" x="255" y="249" text-anchor="middle" font-size="12" fill="#9AA0B0">PostgreSQL</text><text class="mono" x="28" y="290" font-size="12" fill="#5D6475">neuriq-ai.onrender.com</text><g class="go"><text class="mono" x="562" y="290" text-anchor="end" font-size="13" fill="#FF7A45">open →</text></g></g><g class="up" style="animation-delay:.3s"><circle class="pulse" cx="476" cy="140" r="44" fill="#FF7A45" fill-opacity=".10"/><circle cx="476" cy="140" r="46" stroke="#FF7A45" stroke-opacity=".35" stroke-dasharray="3 6"/><circle cx="476" cy="140" r="34" fill="#0E1118" stroke="#FF7A45" stroke-opacity=".7"/><circle class="blink" cx="456" cy="140" r="5" fill="#FF7A45"/><text class="mono" x="466" y="145" font-size="13" fill="#FF7A45" letter-spacing="1.5">LIVE</text></g></svg>