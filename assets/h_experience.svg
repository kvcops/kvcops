<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" fill="none" role="img"><style>
.serif{font-family:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif} .sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){ *{animation:none!important} }

.in{animation:in .9s cubic-bezier(.2,.8,.2,1) both}@keyframes in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.ul{stroke-dasharray:1200;stroke-dashoffset:1200;animation:ul 1.6s .3s cubic-bezier(.6,0,.2,1) forwards}@keyframes ul{to{stroke-dashoffset:0}}
.cm{animation:cm 4s 1.8s linear infinite}@keyframes cm{from{transform:translateX(-80px)}to{transform:translateX(1260px)}}
</style><defs><linearGradient id="cmg" x1="0" x2="1"><stop offset="0" stop-color="#F5B759" stop-opacity="0"/><stop offset="1" stop-color="#F5B759"/></linearGradient><radialGradient id="hdg" cx="0%" cy="0%" r="60%"><stop offset="0" stop-color="#F5B759" stop-opacity=".14"/><stop offset="1" stop-color="#F5B759" stop-opacity="0"/></radialGradient><clipPath id="hcl"><rect width="1200" height="92" rx="16"/></clipPath></defs><rect x=".5" y=".5" width="1199" height="91" rx="16" fill="#07090D" stroke="#232A3A"/><rect x=".5" y=".5" width="1199" height="91" rx="16" fill="url(#hdg)"/><g class="in"><text class="mono" x="30" y="32" font-size="12" fill="#F5B759" letter-spacing="2.5">FILE 03 / 07</text><text class="serif" x="28" y="70" font-size="34" font-weight="600" fill="#ECE8E1" letter-spacing="-.5">Field record</text><text class="mono" x="1170" y="68" text-anchor="end" font-size="12" fill="#9AA0B0" letter-spacing="1.2">1.5+ years · pilots → production</text></g><line class="ul" x1="30" y1="91" x2="1170" y2="91" stroke="#F5B759" stroke-opacity=".5"/><g clip-path="url(#hcl)"><rect class="cm" x="0" y="89" width="80" height="3" rx="1.5" fill="url(#cmg)"/></g></svg>