chor="middle" font-size="12" fill="#9AA0B0">Gemini</text><rect x="308" y="232" width="79" height="26" rx="13" fill="#131722" stroke="#232A3A"/><text class="mono" x="348" y="249" text-anchor="middle" font-size="12" fill="#9AA0B0">BM25+RRF</text><text class="mono" x="28" y="290" font-size="12" fill="#5D6475">github.com/kvcops/ReferentWeave</text><g class="go"><text class="mono" x="562" y="290" text-anchor="end" font-size="13" fill="#F5B759">open →</text></g></g><g class="up" style="animation-delay:.3s"><text class="mono" x="390" y="78" font-size="10.5" fill="#5D6475" letter-spacing="1.5">RECALL@1 · N=60</text><text class="mono" x="390" y="96" font-size="11" fill="#9AA0B0">standard</text><rect x="390" y="104" width="172" height="14" rx="4" fill="#131722"/><rect class="bar" x="390" y="104" width="31" height="14" rx="4" fill="#5D6475" style="animation-delay:0.6s"/><text class="mono" x="562" y="96" text-anchor="end" font-size="11.5" fill="#ECE8E1">18.3%</text><text class="mono" x="390" y="144" font-size="11" fill="#9AA0B0">weave</text><rect x="390" y="152" width="172" height="14" rx="4" fill="#131722"/><rect class="bar" x="390" y="152" width="109" height="14" rx="4" fill="#F5B759" style="animation-delay:0.8999999999999999s"/><text class="mono" x="562" y="144" text-anchor="end" font-size="11.5" fill="#ECE8E1">63.3%</text><text class="mono" x="390" y="206" font-size="10.5" fill="#5D6475">R@3 98.3% · R@5 100%</text></g></svg>